name: Setup Docker Buildx (GCR mirror)
description: Buildx builder with mirror.gcr.io as Docker Hub pull-through cache

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4
      with:
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]
