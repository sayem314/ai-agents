# Publishes all 18 multi-arch tags to Docker Hub.
#
# Hub tag scheme (repo sayem314/ai-agents):
#   Floating:  codex, claude-code, opencode, codex-node, …
#   Pinned:    codex-0.136.0, codex-node-0.136.0, … (when CLI version set in Dockerfile)
#
# Required repo configuration:
#   Secrets:  DOCKERHUB_TOKEN
#   Variables: DOCKERHUB_USERNAME (e.g. sayem314)

name: Publish

on:
  schedule:
    # Weekly — Sunday 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

concurrency:
  group: publish-docker-hub
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: sayem314/ai-agents
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    name: ${{ matrix.tool }}-${{ matrix.lang }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        tool: [codex, claude, opencode]
        lang: [node, python, go, rust, java, full]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish image
        run: make publish TOOL=${{ matrix.tool }} LANG=${{ matrix.lang }} REGISTRY=${{ env.REGISTRY }} PLATFORMS="${{ env.PLATFORMS }}"
