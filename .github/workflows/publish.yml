# Publishes multi-arch images to Docker Hub when upstream stable > Hub (or tag missing).
#
# Version sources:
#   Codex:     https://github.com/openai/codex/tags (rust-vX.Y.Z stable)
#   Claude:    https://github.com/anthropics/claude-code/tags (vX.Y.Z)
#   OpenCode:  https://github.com/anomalyco/opencode/tags (vX.Y.Z)
#
# Hub tags: floating (codex, claude-code, …) + pinned (codex-0.136.0, …)
#
# Required repo configuration:
#   Secrets:  DOCKERHUB_TOKEN
#   Variables: DOCKERHUB_USERNAME (e.g. sayem314)

name: Publish

on:
  schedule:
    # Daily — check upstream vs Docker Hub
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Publish all tools even if Hub is up to date
        type: boolean
        default: false

concurrency:
  group: publish-docker-hub
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: sayem314/ai-agents
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  plan:
    name: Check versions
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      matrix: ${{ steps.plan.outputs.matrix }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve upstream vs Docker Hub
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then
            export FORCE=true
          else
            export FORCE=false
          fi
          bash docker/common/publish-plan.sh

      - name: Summary
        run: |
          echo "### Publish plan" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.plan.outputs.plan }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: ${{ matrix.tool }}-${{ matrix.lang }}
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish image
        env:
          CODEX_VERSION: ${{ matrix.tool == 'codex' && matrix.version || '' }}
          CLAUDE_VERSION: ${{ matrix.tool == 'claude' && matrix.version || '' }}
          OPENCODE_VERSION: ${{ matrix.tool == 'opencode' && matrix.version || '' }}
        run: |
          make publish \
            TOOL=${{ matrix.tool }} \
            LANG=${{ matrix.lang }} \
            REGISTRY=${{ env.REGISTRY }} \
            PLATFORMS="${{ env.PLATFORMS }}" \
            CODEX_VERSION="${CODEX_VERSION}" \
            CLAUDE_VERSION="${CLAUDE_VERSION}" \
            OPENCODE_VERSION="${OPENCODE_VERSION}"
