# Reusable publish workflow for one tool (5 language variants, sequential).
#
# Required repo configuration:
#   Secrets:  DOCKERHUB_TOKEN
#   Variables: DOCKERHUB_USERNAME (e.g. sayem314)

name: Publish tool

on:
  workflow_call:
    inputs:
      tool:
        description: codex, claude, or opencode
        required: true
        type: string
      force:
        description: Publish even if Docker Hub is up to date
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_TOKEN:
        required: true

concurrency:
  group: publish-${{ inputs.tool }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: sayem314/ai-agents
  PLATFORMS: linux/amd64,linux/arm64
  TOOL: ${{ inputs.tool }}

jobs:
  plan:
    name: Check versions (${{ inputs.tool }})
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      matrix: ${{ steps.plan.outputs.matrix }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve upstream vs Docker Hub
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TOOL: ${{ inputs.tool }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: bash docker/common/publish-plan.sh

      - name: Summary
        run: |
          echo "### Publish plan (${{ inputs.tool }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.plan.outputs.plan }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: ${{ matrix.lang }}
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: ./.github/actions/setup-buildx-mirror

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish image
        env:
          CODEX_VERSION: ${{ inputs.tool == 'codex' && matrix.version || '' }}
          CLAUDE_VERSION: ${{ inputs.tool == 'claude' && matrix.version || '' }}
          OPENCODE_VERSION: ${{ inputs.tool == 'opencode' && matrix.version || '' }}
        run: |
          make publish \
            TOOL=${{ inputs.tool }} \
            LANG=${{ matrix.lang }} \
            REGISTRY=${{ env.REGISTRY }} \
            PLATFORMS="${{ env.PLATFORMS }}" \
            CODEX_VERSION="${CODEX_VERSION}" \
            CLAUDE_VERSION="${CLAUDE_VERSION}" \
            OPENCODE_VERSION="${OPENCODE_VERSION}"
