# Daily upstream check + publish for OpenCode images (5 language variants).
# Version source: https://github.com/anomalyco/opencode/tags (vX.Y.Z)

name: Publish OpenCode

on:
  schedule:
    # Daily at 14:00 UTC
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Publish all OpenCode variants even if Hub is up to date
        type: boolean
        default: false

jobs:
  publish:
    uses: ./.github/workflows/publish-tool.yml
    with:
      tool: opencode
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
